<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS School Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a
            href="index.html"
            class="header__logo"
            aria-label="Coffee House — Home"
        >
            <img
                src="assets/icons/logo.svg"
                alt=""
                class="header__logo-img header__logo-img--light"
            >
            <img
                src="assets/icons/logo-dark.svg"
                alt=""
                class="header__logo-img header__logo-img--dark"
            >
        </a>

        <nav class="header__nav" aria-label="Main navigation">
            <ul class="header__nav-list">
                <li>
                    <a href="#favorite" class="header__nav-link">
                        Favorite coffee
                    </a>
                </li>
                <li>
                    <a href="#about" class="header__nav-link">About</a>
                </li>
                <li>
                    <a href="#mobile-app" class="header__nav-link">
                        Mobile app
                    </a>
                </li>
                <li>
                    <a href="#contact" class="header__nav-link">
                        Contact us
                    </a>
                </li>
            </ul>
        </nav>
        <div class="header__actions">
            <button
                type="button"
                class="header__theme-toggle"
                aria-label="Switch to dark theme"
                aria-pressed="false"
            >
                <img
                    src="assets/icons/sun.svg"
                    alt=""
                    class="header__theme-icon header__theme-icon--sun"
                >
                <img
                    src="assets/icons/moon.svg"
                    alt=""
                    class="header__theme-icon header__theme-icon--moon"
                >
            </button>
        
            <a href="menu.html" class="header__menu-link">
                <span>Menu</span>
                <img
                    src="assets/icons/coffee-cup.svg"
                    alt=""
                    class="header__menu-icon"
                >
            </a>
        </div>
        <button
            type="button"
            class="header__burger"
            aria-label="Open menu"
        >
            <span class="header__burger-line"></span>
            <span class="header__burger-line"></span>
        </button>
    </header>

    <main>
        <section id="hero" class="hero">

        </section>

        <section id="favorite" class="favorite">

        </section>
        <section class="gallery">
            <div class="gallery__track">
                <div class="gallery__slide"></div>
                <div class="gallery__slide"></div>
                <div class="gallery__slide"></div>
                <div class="gallery__slide"></div>
            </div>

            <div class="gallery__controls">
                <button type="button" class="gallery__prev" aria-label="Previous slide">&larr;</button>
                <button type="button" class="gallery__next" aria-label="Next slide">&rarr;</button>
            </div>
        </section>
        <section id="about" class="about">

        </section>

        <section id="mobile-app" class="app-promo">

        </section>

    </main>

    <footer>
        <p class="footer__tagline">Sip, Savor, Smile. <span>It's coffee time!</span></p>

        <address id="contact" class="footer__contact">
            <a href="tel:+10000000000">+1 000 000 0000</a>
            <a href="mailto:info@coffeehouse.com">info@coffeehouse.com</a>
        </address>

        <nav class="footer__social" aria-label="Social media">
            <ul>
                <li><a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a></li>
                <li><a href="https://facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a></li>
                <li><a href="https://twitter.com" target="_blank" rel="noopener noreferrer">Twitter</a></li>
            </ul>
        </nav>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
